<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent City — city themes mockup</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { --ink:#1b2a3a; --muted:#5d6b7c; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); background:var(--bg); transition:background .4s; overflow:hidden; }
  .app { position:relative; height:100%; display:flex; flex-direction:column; }
  header { position:absolute; z-index:3; top:18px; left:22px; right:22px; display:flex; align-items:flex-start; gap:16px; pointer-events:none; }
  .eyebrow { font-size:11px; letter-spacing:2.2px; text-transform:uppercase; color:var(--muted); }
  h1 { margin:2px 0 0; font-size:24px; font-weight:600; letter-spacing:-.4px; color:var(--title); }
  .switch { margin-left:auto; pointer-events:auto; display:flex; gap:4px; padding:4px; border-radius:12px; background:rgba(255,255,255,.8); box-shadow:0 1px 3px rgba(20,30,50,.12); backdrop-filter:blur(6px); }
  .switch button { border:0; background:transparent; font:inherit; font-weight:600; padding:7px 12px; border-radius:9px; cursor:pointer; color:var(--muted); display:flex; align-items:center; gap:7px; }
  .switch button[aria-pressed=true] { background:var(--accent); color:#fff; }
  .switch button:not([aria-pressed=true]):hover { background:rgba(0,0,0,.05); }
  .chip { width:14px; height:14px; border-radius:3px; display:inline-block; }
  .chip.sf { background:linear-gradient(135deg,#0176d3 50%,#c0362c 50%); border-radius:50%; }
  .chip.zh { background:linear-gradient(135deg,#fff 50%,#0f69b4 50%); outline:1px solid rgba(0,0,0,.15); }
  .stage { position:relative; flex:1; min-height:0; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .labels { position:absolute; inset:0; pointer-events:none; }
  .label { position:absolute; transform:translate(-50%,-100%); background:#fff; padding:8px 13px 8px; min-width:120px; box-shadow:0 2px 8px rgba(20,30,50,.12); white-space:nowrap; transition:opacity .3s; }
  .label b { display:block; font-weight:600; font-size:13.5px; color:var(--ink); }
  .label span { color:var(--muted); font-size:12px; }
  .label .needs { color:#a96500; font-weight:600; }
  /* San Francisco labels: Lightning-card feel */
  body.sf .label { border-radius:10px; border:1px solid #e5e5e5; border-top:3px solid #0176d3; font-family:"Salesforce Sans",-apple-system,BlinkMacSystemFont,sans-serif; }
  body.sf .label span.live { color:#0176d3; font-weight:600; }
  /* Zurich labels: Swiss typographic style */
  body.zh .label { border-radius:2px; padding-left:28px; font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; }
  body.zh .label::before { content:""; position:absolute; left:10px; top:11px; width:11px; height:11px; background:linear-gradient(135deg,#fff 50%,#0f69b4 50%); outline:1px solid #c9d3de; }
  body.zh .label b { letter-spacing:-.2px; }
  body.zh .label span.live { color:#0f69b4; font-weight:600; }
  .civic { position:absolute; transform:translate(-50%,0); font-size:10.5px; font-weight:700; letter-spacing:1.6px; color:var(--civic); text-shadow:0 0 4px rgba(255,255,255,.9); white-space:nowrap; }
  aside { position:absolute; z-index:3; right:22px; bottom:62px; width:330px; background:rgba(255,255,255,.88); backdrop-filter:blur(8px); border-radius:12px; padding:12px 14px; box-shadow:0 2px 10px rgba(20,30,50,.12); }
  aside h3 { margin:0 0 6px; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); }
  aside table { border-collapse:collapse; width:100%; }
  aside td { padding:2.5px 0; vertical-align:top; }
  aside td:first-child { color:var(--muted); width:108px; }
  aside .note { margin-top:7px; font-size:11.5px; color:var(--muted); }
  .controls { position:absolute; z-index:3; right:22px; bottom:18px; display:flex; gap:6px; }
  .controls button { border:0; font:inherit; font-weight:600; padding:7px 11px; border-radius:9px; background:rgba(255,255,255,.88); box-shadow:0 1px 3px rgba(20,30,50,.12); cursor:pointer; color:var(--ink); }
</style>
</head>
<body class="sf">
<div class="app">
  <header>
    <div>
      <div class="eyebrow">A living view of your projects</div>
      <h1 id="title">5 projects · one city by the Bay</h1>
    </div>
    <div class="switch" role="group" aria-label="City theme">
      <button data-theme="sf" aria-pressed="true"><i class="chip sf"></i>San Francisco</button>
      <button data-theme="zh" aria-pressed="false"><i class="chip zh"></i>Zürich</button>
    </div>
  </header>
  <div class="stage">
    <canvas id="c"></canvas>
    <div class="labels" id="labels"></div>
  </div>
  <aside hidden>
    <h3 id="legendTitle">San Francisco theme</h3>
    <table id="legend"></table>
    <div class="note">Mockup only. Same projects, counts and meaning as today; only artwork, palette and label styling change. Clocks show the real time.</div>
  </aside>
  <div class="controls"><button id="legendBtn">Show legend</button><button id="pause">Pause motion</button></div>
</div>
<script>
// ---------------------------------------------------------------- data (mirrors the screenshot)
const BLOCK = 340, COLS = 3, ROWS = 2, W = COLS * BLOCK + 20, FRONT = ROWS * BLOCK, DEPTH = FRONT + 215;
const PROJECTS = [
  { id:'zcc',  name:'zana-command-cen…',   col:1, row:0, live:7, working:5, needs:1 },
  { id:'prov', name:'agentforce-provisio…', col:2, row:0, live:1, working:0, needs:0 },
  { id:'pony', name:'limited-pony',         col:0, row:1, live:1, working:1, needs:0 },
  { id:'btg',  name:'btgsdigico--agentai…', col:1, row:1, live:3, working:2, needs:1 },
  { id:'labs', name:'agentforce-labs-ag…',  col:2, row:1, live:1, working:1, needs:0 },
].map((p, i) => ({ ...p, lot:i, u:p.col * BLOCK + 70, v:p.row * BLOCK + 90, w:150, d:110,
  form: p.live >= 5 ? 'tower' : p.live >= 2 ? 'office' : 'house' }));
const SHIRTS = ['#d97757', '#3d4a5c', '#2f8f6b', '#7a5bc4'];

// ---------------------------------------------------------------- themes
const THEMES = {
  sf: {
    title:'5 projects · one city by the Bay', label:'San Francisco theme', accent:'#0176d3', titleInk:'#032d60', civic:'#032d60',
    bg:'linear-gradient(#e9eff5,#f4f1ea)',
    c:{ ground:'#d2d8bf', groundfront:'#b9c19f', groundside:'#a7b08e', grass:'#c3cfa4', lawn:'#cfd9b2', path:'#ece6d8', curb:'#d3d0c4',
        road:'#5e6870', roadedge:'#4f5960', stripe:'#efe6c4', rail:'#b9bdc0', tree:'#6f9a6a', treebright:'#97b97f', treedark:'#4c7558', bark:'#86705e',
        water:'#8db7cf', waterdeep:'#6d9dbc', warm:'#f7d99a', warmbright:'#fff1c9', glassdark:'#56707f', glass:'#7f9fb2', shadow:'#3e5260', skin:'#e7b896', black:'#2f3d48', white:'#fbfaf6' },
    lots:['#e8a3b5', '#b6d6c8', '#c9b7e3', '#f0d488', '#9fc3e6'],
    legend:[['5+ agents','Salesforce Tower — the crown glows while agents work, amber when one needs you'],['2–4 agents','SoMa brick loft with rooftop water tank'],['1 agent','Painted Lady Victorian, tuck-under garage'],['Scheduler','Ferry Building clock tower'],['Done','Caltrain depot'],['Commons','Salesforce Park, raised over the transit center'],['Ambient','Cable cars, Muni, Caltrain, Golden Gate, Karl the Fog']],
  },
  zh: {
    title:'5 projects · one city on the lake', label:'Zürich theme', accent:'#0f69b4', titleInk:'#0b2f57', civic:'#0b2f57',
    bg:'linear-gradient(#dde9f3,#f2f4f2)',
    c:{ ground:'#c8d9b9', groundfront:'#a9c09b', groundside:'#98b08b', grass:'#b6cfa0', lawn:'#c4dab0', path:'#e8e4da', curb:'#cfd1c9',
        road:'#7a8288', roadedge:'#666e74', stripe:'#ecefe9', rail:'#9aa1a6', tree:'#6c9c69', treebright:'#97bf80', treedark:'#4b7a57', bark:'#7f6a58',
        water:'#93c4d6', waterdeep:'#6fa8c2', warm:'#f7dc9f', warmbright:'#fff2cf', glassdark:'#4f6d6a', glass:'#7aa098', shadow:'#3a5560', skin:'#e8bb98', black:'#2c3a42', white:'#fdfdfb' },
    lots:['#f1e2c0', '#e9b9a3', '#cfdcc1', '#f0d79c', '#d6dfe9'],
    legend:[['5+ agents','Prime Tower — green glass, flag lit while agents work'],['2–4 agents','Paradeplatz bank house with mansard roof'],['1 agent','Altstadt townhouse with shutters and dormer'],['Scheduler','St. Peter — the largest church clock face in Europe'],['Done','Hauptbahnhof with the SBB station clock'],['Commons','Lindenhof chess and the Grossmünster towers'],['Ambient','Blue-white trams, SBB train, lake steamer, swans, the Alps']],
  },
};
let T = THEMES.sf, themeId = 'sf';
const C = k => T.c[k] || k;

// ---------------------------------------------------------------- isometric primitives (same projection as scene.js)
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const P = (u, v, z = 0) => [(u - v) * .72, (u + v) * .35 - z];
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
const shade = (hex, f) => { const n = parseInt(hex.slice(1), 16); const ch = s => Math.max(0, Math.min(255, Math.round(((n >> s) & 255) * f))); return '#' + [16, 8, 0].map(s => ch(s).toString(16).padStart(2, '0')).join(''); };
function poly(pts, c, stroke, lw = 1) { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); if (c) { ctx.fillStyle = C(c); ctx.fill(); } if (stroke) { ctx.strokeStyle = C(stroke); ctx.lineWidth = lw; ctx.stroke(); } }
function line(pts, c, lw = 1) { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.strokeStyle = C(c); ctx.lineWidth = lw; ctx.stroke(); }
function plane(u, v, w, d, z, c) { poly([P(u, v, z), P(u + w, v, z), P(u + w, v + d, z), P(u, v + d, z)], c); }
function fRect(u, vF, w, z, h, c) { poly([P(u, vF, z), P(u + w, vF, z), P(u + w, vF, z + h), P(u, vF, z + h)], c); }
function sRect(uF, v, d, z, h, c) { poly([P(uF, v, z), P(uF, v + d, z), P(uF, v + d, z + h), P(uF, v, z + h)], c); }
function prism(u, v, w, d, h, z, top, front, side) { fRect(u, v + d, w, z, h, front); sRect(u + w, v, d, z, h, side); plane(u, v, w, d, z + h, top); }
function ellipse(x, y, rx, ry, c) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fillStyle = typeof c === 'string' ? C(c) : c; ctx.fill(); }
function round(x, y, w, h, r, c) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fillStyle = C(c); ctx.fill(); }
function shadowPad(u, v, w, d, a = .16) { ctx.save(); ctx.filter = 'blur(6px)'; plane(u + 8, v + 9, w + 14, d + 10, 0, rgba(C('shadow'), a)); ctx.restore(); }
function oval(u, v, rx, ry, c) { const [x, y] = P(u, v); ctx.save(); ctx.translate(x, y); ctx.transform(.72, .35, -.72, .35, 0, 0); ellipse(0, 0, rx, ry, c); ctx.restore(); }
// Circle drawn in the front (v = const) or side (u = const) wall plane.
function wallCircle(u, v, z, r, c, side = false, stroke) { const pts = []; for (let i = 0; i < 28; i++) { const t = i / 28 * Math.PI * 2; pts.push(side ? P(u, v + Math.cos(t) * r, z + Math.sin(t) * r) : P(u + Math.cos(t) * r, v, z + Math.sin(t) * r)); } poly(pts, c, stroke, 1.2); }
function clockFace(u, v, z, r, side, face, ink) {
  wallCircle(u, v, z, r + 1.6, ink, side); wallCircle(u, v, z, r, face, side);
  const now = new Date(), hr = (now.getHours() % 12 + now.getMinutes() / 60) / 12 * Math.PI * 2, mn = now.getMinutes() / 60 * Math.PI * 2;
  const tip = (a, len) => side ? P(u, v + Math.sin(a) * len * (-1), z + Math.cos(a) * len) : P(u + Math.sin(a) * len, v, z + Math.cos(a) * len);
  const o = side ? P(u, v, z) : P(u, v, z);
  line([o, tip(hr, r * .55)], ink, 1.6); line([o, tip(mn, r * .85)], ink, 1.1);
  for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; line([tip(a, r * .8), tip(a, r * .95)], ink, .8); }
}
function arch(u, vF, w, z, h, c) { const pts = [P(u, vF, z), P(u + w, vF, z)]; for (let i = 0; i <= 10; i++) { const t = i / 10 * Math.PI; pts.push(P(u + w / 2 + Math.cos(t) * w / 2, vF, z + h - w / 2 + Math.sin(t) * w / 2)); } poly(pts, c); }
function pyramid(u, v, w, d, z, h, front, side) { const apex = P(u + w / 2, v + d / 2, z + h); poly([P(u, v + d, z), P(u + w, v + d, z), apex], front); poly([P(u + w, v, z), P(u + w, v + d, z), apex], side); }
function gableFront(u, v, w, d, z, r, roofL, roofR, wall) { // ridge runs along v, gable faces the viewer's left
  poly([P(u, v, z), P(u, v + d, z), P(u + w / 2, v + d, z + r), P(u + w / 2, v, z + r)], roofL);
  poly([P(u + w, v, z), P(u + w, v + d, z), P(u + w / 2, v + d, z + r), P(u + w / 2, v, z + r)], roofR);
  poly([P(u, v + d, z), P(u + w, v + d, z), P(u + w / 2, v + d, z + r)], wall);
}
function gableSide(u, v, w, d, z, r, roofF, wall) { // ridge runs along u, gable faces the viewer's right
  poly([P(u, v, z), P(u + w, v, z), P(u + w, v + d / 2, z + r), P(u, v + d / 2, z + r)], shade(C(roofF), .82));
  poly([P(u, v + d, z), P(u + w, v + d, z), P(u + w, v + d / 2, z + r), P(u, v + d / 2, z + r)], roofF);
  poly([P(u + w, v, z), P(u + w, v + d, z), P(u + w, v + d / 2, z + r)], wall);
}
function tree(u, v, s = 1, z = 0, kind = 'round') {
  const [x, y] = P(u, v, z);
  if (z === 0) oval(u + 6, v + 5, 16 * s, 14 * s, rgba(C('shadow'), .16));
  if (kind === 'cypress') { round(x - 2 * s, y - 14 * s, 4 * s, 15 * s, 2, 'bark'); ellipse(x, y - 34 * s, 10 * s, 26 * s, 'treedark'); ellipse(x - 3 * s, y - 38 * s, 6 * s, 18 * s, 'tree'); return; }
  if (kind === 'palm') { line([[x, y], [x + 3 * s, y - 22 * s], [x + 2 * s, y - 44 * s]], 'bark', 3 * s); for (let i = 0; i < 7; i++) { const a = i / 7 * Math.PI * 2; ctx.beginPath(); ctx.moveTo(x + 2 * s, y - 44 * s); ctx.quadraticCurveTo(x + 2 * s + Math.cos(a) * 12 * s, y - 50 * s + Math.sin(a) * 4 * s, x + 2 * s + Math.cos(a) * 18 * s, y - 40 * s + Math.sin(a) * 6 * s); ctx.strokeStyle = C(i % 2 ? 'tree' : 'treedark'); ctx.lineWidth = 3 * s; ctx.stroke(); } return; }
  round(x - 2 * s, y - 28 * s, 5 * s, 31 * s, 2 * s, 'bark');
  ellipse(x, y - 37 * s, 19 * s, 23 * s, 'treedark'); ellipse(x - 5 * s, y - 43 * s, 16 * s, 19 * s, 'tree'); ellipse(x - 8 * s, y - 48 * s, 10 * s, 10 * s, 'treebright'); ellipse(x + 10 * s, y - 35 * s, 10 * s, 14 * s, 'tree');
}
let time = 0, motion = true;
function person(u, v, shirt, walk = false, z = 0, size = 1) {
  const [x, y] = P(u, v, z), st = walk && motion ? Math.sin(time * 8 + u) * 1.4 : 0;
  ctx.save(); ctx.translate(x, y); ctx.scale(size, size);
  ellipse(0, 1, 5, 2, rgba(C('shadow'), .18));
  round(-3, -4 + st, 2.7, 6, 1, 'black'); round(1, -4 - st, 2.7, 6, 1, 'black');
  round(-5, -14, 10, 11, 3, shirt); round(-6, -12 + st, 2.5, 7, 1, 'skin'); round(4, -12 - st, 2.5, 7, 1, 'skin');
  round(-3.7, -21, 7.5, 8, 3, 'skin'); round(-4, -22, 8, 4, 2, 'black');
  ctx.restore();
}
function windowsFront(u, vF, w, z, h, cols, rows, ww, wh, lit, glass = 'glassdark', frame) {
  const gx = (w - cols * ww) / (cols + 1), gz = (h - rows * wh) / (rows + 1);
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const a = u + gx + c * (ww + gx), b = z + gz + r * (wh + gz), on = lit(r, c);
    if (frame) fRect(a - 1.2, vF + .05, ww + 2.4, b - 1.2, wh + 2.4, frame);
    fRect(a, vF + .1, ww, b, wh, on ? 'warm' : glass);
    if (on) fRect(a + 1, vF + .15, ww - 2, b + wh * .45, wh * .45, 'warmbright');
  }
}
function windowsSide(uF, v, d, z, h, cols, rows, ww, wh, lit, glass = 'glassdark', frame) {
  const gx = (d - cols * ww) / (cols + 1), gz = (h - rows * wh) / (rows + 1);
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const a = v + gx + c * (ww + gx), b = z + gz + r * (wh + gz), on = lit(r, c);
    if (frame) sRect(uF + .05, a - 1.2, ww + 2.4, b - 1.2, wh + 2.4, frame);
    sRect(uF + .1, a, ww, b, wh, on ? 'warm' : glass);
  }
}
// Lit-window picker: exactly `n` of the windows light up, chosen stably.
const litPicker = (n, total, seed) => { const set = new Set(); let k = seed; while (set.size < Math.min(n, total)) { k = (k * 9301 + 49297) % 233280; set.add(k % total); } return set; };
function needsBeacon(u, v, z) { const [x, y] = P(u, v, z); const pulse = motion ? (Math.sin(time * 4) + 1) / 2 : .6; ellipse(x, y - 12, 14 + pulse * 6, 14 + pulse * 6, rgba('#f2a93b', .18 + .1 * pulse)); round(x - 8, y - 22, 16, 18, 5, '#f2a93b'); ctx.fillStyle = '#3b2a10'; ctx.font = 'bold 13px -apple-system,sans-serif'; ctx.textAlign = 'center'; ctx.fillText('!', x, y - 8); ctx.textAlign = 'start'; }

// ---------------------------------------------------------------- San Francisco artwork
function sfTower(p) {
  const cu = p.u + 75, cvv = p.v + 55, H = 340, b0 = 62, b1 = 47, ch = .3;
  shadowPad(p.u, p.v, p.w, p.d, .2);
  prism(p.u - 6, p.v - 6, p.w + 12, p.d + 12, 6, 0, 'path', 'curb', 'curb');
  const pts = (s, z) => { const c = s * ch; return { fa:P(cu - s + c, cvv + s, z), fb:P(cu + s - c, cvv + s, z), db:P(cu + s, cvv + s - c, z), sb:P(cu + s, cvv - s + c, z), oct:[[cu - s + c, cvv + s], [cu + s - c, cvv + s], [cu + s, cvv + s - c], [cu + s, cvv - s + c], [cu + s - c, cvv - s], [cu - s + c, cvv - s], [cu - s, cvv - s + c], [cu - s, cvv + s - c]].map(([a, b]) => P(a, b, z)) }; };
  const size = z => b0 + (b1 - b0) * Math.pow(z / H, 1.35);
  const bot = pts(b0, 6), top = pts(size(H), H);
  const glassF = '#bcd2df', glassD = '#a2bfd0', glassS = '#88a8bc';
  poly([bot.fa, bot.fb, top.fb, top.fa], glassF); poly([bot.fb, bot.db, top.db, top.fb], glassD); poly([bot.db, bot.sb, top.sb, top.db], glassS);
  // lit floors: warm bands on a few floors for each working agent
  const floorsLit = litPicker(p.working * 4, 30, 7), lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
  for (let f = 0; f < 30; f++) {
    const z0 = 14 + f * 10.8, z1 = z0 + 6, A = pts(size(z0), z0), B = pts(size(z1), z1);
    if (floorsLit.has(f)) { const t0 = (f * 37 % 50) / 100, t1 = t0 + .35; poly([lerp(A.fa, A.fb, t0), lerp(A.fa, A.fb, t1), lerp(B.fa, B.fb, t1), lerp(B.fa, B.fb, t0)], rgba('#f7d99a', .85)); }
    line([A.fa, A.fb, A.db, A.sb], rgba('#ffffff', .55), .7);
  }
  // vertical fins
  for (const [a, b, n] of [['fa', 'fb', 9], ['fb', 'db', 3], ['db', 'sb', 7]]) for (let i = 1; i < n; i++) line([lerp(bot[a], bot[b], i / n), lerp(top[a], top[b], i / n)], rgba('#ffffff', .45), .8);
  // crown: open perforated screen above the last floor; LEDs glow with live work
  const crownTop = H + 44, ct = pts(size(H) * .93, crownTop);
  poly([top.fa, top.fb, ct.fb, ct.fa], '#e7eef2'); poly([top.fb, top.db, ct.db, ct.fb], '#d5e0e7'); poly([top.db, top.sb, ct.sb, ct.db], '#c3d1db');
  for (const [a, b, n] of [['fa', 'fb', 18], ['fb', 'db', 6], ['db', 'sb', 14]]) for (let i = 1; i < n; i++) line([lerp(top[a], top[b], i / n), lerp(ct[a], ct[b], i / n)], rgba('#8aa1b0', .5), .6);
  poly(ct.oct, '#dfe7ec');

    const [x, y] = P(tu + tw / 2, tv + 10, 123); ellipse(x, y, 10, 6, '#3f4a50'); ctx.beginPath(); ctx.moveTo(x - 10, y); ctx.quadraticCurveTo(x, y - 30, x + 10, y); ctx.fillStyle = '#4a565c'; ctx.fill(); line([[x, y - 15], [x, y - 24]], '#d9b34c', 1.4);
  }
}

// ---------------------------------------------------------------- vehicles
function vblock(u, v, a, b, w, d, h, z, top, front, side) { prism(u + a, v + b, w, d, h, z, top, front, side); }
function cableCar(u, v) {
  oval(u + 22, v + 12, 26, 12, rgba(C('shadow'), .15));

}
function muni(u, v) {

  fRect(u, v + 22.1, 62, 9, 3, '#c8312d');
  fRect(u + 4, v + 22.2, 54, 16, 8, 'glassdark'); sRect(u + 62.1, v + 3, 16, 16, 9, 'glassdark');
  for (const a of [10, 50]) { const q = P(u + a, v + 23, 7); ellipse(q[0], q[1], 3.2, 4, '#2f3d48'); }
}
function tram(u, v) {
  const seg = 31;
  oval(u + 48, v + 12, 52, 13, rgba(C('shadow'), .15));
  for (let i = 0; i < 3; i++) {
    const a = u + i * (seg + 2);
    vblock(a, v, 0, 0, seg, 21, 20, 6, '#f4f6f8', '#f4f6f8', '#dde3e8');
    fRect(a, v + 21.1, seg, 6, 7, '#0f69b4'); sRect(a + seg + .1, v, 21, 6, 7, '#0b4f88');
    fRect(a + 3, v + 21.2, seg - 6, 15, 8, 'glassdark');

  const pa = P(u + 50, v + 10, 26), pb = P(u + 60, v + 10, 36); line([pa, pb, P(u + 66, v + 10, 36)], '#3a3f44', 1);
}
function caltrain(u0) {
  const v = FRONT + 180;
  for (let n = 0; n < 3; n++) {
    const u = u0 - n * 82; if (u < 6 || u + 76 > W - 6) continue;

    if (n === 0) sRect(u + 76.1, v + 4, 16, 18, 10, 'glassdark');
  }
}
function sbbTrain(u0) {
  const v = FRONT + 180;
  for (let n = 0; n < 3; n++) {
    const u = u0 - n * 82; if (u < 6 || u + 76 > W - 6) continue;
    shadowPad(u, v, 76, 24);
    prism(u, v, 76, 24, 24, 6, '#9aa2a7', '#d52b1e', '#ad2318');
    fRect(u, v + 24.1, 76, 12, 2, '#ffffff');
    fRect(u + 4, v + 24.2, 68, 18, 7, 'glassdark');
    if (n === 0) { sRect(u + 76.1, v + 4, 16, 18, 9, 'glassdark'); const q = P(u + 76.2, v + 12, 13); round(q[0] - 3, q[1] - 3, 6, 6, 1, '#fff'); }
  }
}

// ---------------------------------------------------------------- city composition
function roads() {
  for (let row = 0; row <= ROWS; row++) {
    const v = row * BLOCK;
    plane(0, v, W, 56, 1, 'curb'); plane(0, v + 5, W, 46, 2, 'path'); plane(0, v + 12, W, 32, 3, 'road');
    if (themeId === 'sf') { for (const o of [22, 34]) plane(0, v + o, W, 1.2, 4, 'rail'); plane(0, v + 27.6, W, .8, 4, '#3d454b'); }
    else { for (const o of [19, 26, 30, 37]) plane(0, v + o, W, 1, 4, 'rail'); }
  }
  for (let col = 0; col <= COLS; col++) {
    const u = col * BLOCK; if (u > W - 50) continue;
    plane(u, 0, 56, FRONT + 56, 1, 'curb'); plane(u + 5, 0, 46, FRONT + 56, 2, 'path'); plane(u + 12, 0, 32, FRONT + 56, 3, 'road');
    for (let v = 65; v < FRONT; v += 36) if (v % BLOCK > 55) plane(u + 27, v, 2, 18, 4, 'stripe');
    for (let row = 0; row <= ROWS; row++) for (let n = 0; n < 5; n++) plane(u + 58 + n * 5, row * BLOCK + 13, 3, 30, 5, 'stripe');
  }
}
function rails() {
  const v = FRONT + 174;
  plane(4, v, W - 8, 36, 1, 'groundside'); plane(4, v + 3, W - 8, 30, 2, 'curb');
  for (let u = 6; u < W - 8; u += 12) plane(u, v + 5, 4, 26, 3, 'bark');
  for (const o of [9, 27]) { plane(4, v + o, W - 8, 2, 5, 'glassdark'); plane(4, v + o, W - 8, 1, 6, 'rail'); }
}
function tramWires(objects) {
  if (themeId !== 'zh') return;
  for (let row = 0; row <= ROWS; row++) for (let u = 30; u < W - 20; u += 110) {
    const v = row * BLOCK + 5;
    objects.push({ depth: u + v, fn: () => { line([P(u, v, 0), P(u, v, 46)], '#4a5157', 1.4); line([P(u, v, 44), P(u, v + 30, 44)], '#4a5157', .9); } });
  }
}
function water() {
  const u = W, wd = 330;
  ctx.save(); ctx.filter = 'blur(10px)'; plane(u, 0, wd, DEPTH, -26, rgba(C('shadow'), .12)); ctx.restore();
  prism(u, 0, wd, DEPTH, 8, -20, 'water', 'waterdeep', 'waterdeep');
  for (let i = 0; i < 26; i++) { const a = (i * 97) % wd, b = (i * 211 + time * 6) % DEPTH; const q = P(u + a, b, -11); line([[q[0] - 5, q[1]], [q[0] + 5, q[1]]], rgba('#ffffff', .45), 1); }
  // quay
  prism(u - 2, 0, 10, DEPTH, 4, -12, 'curb', 'curb', '#b7b4a8');
}
function goldenGate(objects) {
  const bu = W + 210, deckZ = 34, towers = [-110, 430], orange = '#c0362c', orangeS = '#99291f';
  const deck = () => {
    prism(bu, -260, 18, DEPTH + 420, 5, deckZ, orange, orange, orangeS);
    for (const side of [0, 18]) {
      const pts = [];
      for (let v = -260; v <= DEPTH + 160; v += 12) {
        let z;
        if (v < towers[0]) z = deckZ + 6 + (190 - deckZ) * ((v + 260) / (towers[0] + 260)) ** 2;
        else if (v < towers[1]) { const t = (v - towers[0]) / (towers[1] - towers[0]); z = deckZ + 12 + (190 - deckZ - 12) * (1 - 4 * t * (1 - t)); }
        else z = deckZ + 6 + (190 - deckZ) * (1 - (v - towers[1]) / (DEPTH + 160 - towers[1])) ** 2;
        pts.push(P(bu + side, v, z));
        if (v % 24 === 0) line([P(bu + side, v, z), P(bu + side, v, deckZ + 5)], rgba(orange, .55), .5);
      }
      line(pts, orange, 1.6);
    }
  };
  objects.push({ depth: -1e9, fn: deck });
  for (const tv of towers) objects.push({ depth: bu + tv + 30, fn: () => {
    for (const side of [-2, 16]) { prism(bu + side, tv, 6, 8, 196, -12, orange, orange, orangeS); for (let k = 0; k < 5; k++) fRect(bu + side + 1.5, tv + 8.1, 3, 20 + k * 36, 22, orangeS); }
    for (const z of [60, 110, 150, 184]) prism(bu - 2, tv + 1, 24, 6, z === 184 ? 9 : 6, z, orange, orange, orangeS);
  } });
}
function lake(objects) {
  // ZSG paddle steamer, a sail boat and swans on Lake Zurich
  const span = DEPTH + 300, sv = -150 + ((time * 14) % span);
  objects.push({ depth: W + 150 + sv, fn: () => {
    const u = W + 120, v = sv;
    oval(u + 18, v + 40, 22, 48, rgba('#ffffff', .25));
    prism(u, v, 34, 84, 12, -12, '#f5f2ea', '#f5f2ea', '#dcd7cb');
    fRect(u, v + 84.1, 34, -8, 3, '#2f3d48'); sRect(u + 34.1, v, 84, -8, 3, '#2f3d48');
    prism(u + 4, v + 10, 26, 62, 10, 0, '#ffffff', '#ffffff', '#e2ddd2');
    sRect(u + 30.1, v + 14, 54, 3, 4, 'glassdark');
    prism(u + 12, v + 36, 10, 10, 18, 10, '#e9d9a6', '#e9d9a6', '#cdbb85');
    const f = P(u + 17, v + 80, 10); line([f, [f[0], f[1] - 18]], '#2f3d48', 1); poly([[f[0], f[1] - 18], [f[0] + 9, f[1] - 15], [f[0], f[1] - 12]], '#0f69b4');
  } });
  const bv = 700 - ((time * 9) % 900);
  objects.push({ depth: W + 260 + bv, fn: () => { const q = P(W + 250, bv, -12); poly([[q[0] - 12, q[1]], [q[0] + 12, q[1]], [q[0] + 8, q[1] + 5], [q[0] - 8, q[1] + 5]], '#f5f2ea'); poly([[q[0], q[1] - 34], [q[0], q[1] - 2], [q[0] + 16, q[1] - 4]], '#ffffff'); line([[q[0], q[1]], [q[0], q[1] - 36]], '#555', 1); } });
  for (let i = 0; i < 5; i++) { const v = 200 + i * 70 + Math.sin(time * .4 + i) * 12, u = W + 40 + (i % 2) * 30; objects.push({ depth: u + v, fn: () => { const q = P(u, v, -12); ellipse(q[0], q[1] - 2, 5, 2.6, '#ffffff'); line([[q[0] + 3, q[1] - 3], [q[0] + 4, q[1] - 9]], '#ffffff', 2); ellipse(q[0] + 4.5, q[1] - 9.5, 1.6, 1.4, '#ffffff'); ellipse(q[0] + 6, q[1] - 9.4, .9, .6, '#e28a3a'); } }); }
}
// Back-edge silhouette helper: the ground's back edges in screen space.
const backY = x => x < 0 ? -x * (DEPTH * .35) / (DEPTH * .72) : x * (W * .35) / (W * .72);
function alps() {
  const peaks = [[-900, 160], [-760, 30], [-640, 110], [-520, -40], [-420, 60], [-300, -90], [-200, 10], [-90, -150], [0, -60], [110, -190], [220, -80], [330, -170], [440, -30], [560, -120], [700, 20], [830, -60], [960, 100], [1150, 60], [1300, 160]];
  const lerpBase = x => backY(Math.max(-640, Math.min(749, x))) + 60;
  ctx.beginPath(); ctx.moveTo(-900, 2000); peaks.forEach(([x, y]) => ctx.lineTo(x, y)); ctx.lineTo(1300, 2000); ctx.lineTo(-900, 2000); ctx.closePath();
  const g = ctx.createLinearGradient(0, -200, 0, 300); g.addColorStop(0, '#9fb6cb'); g.addColorStop(1, '#c9d8e3'); ctx.fillStyle = g; ctx.fill();
  for (let i = 1; i < peaks.length - 1; i++) { const [x, y] = peaks[i], [px, py] = peaks[i - 1], [nx, ny] = peaks[i + 1]; if (y > 60) continue; const k = .32; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + (nx - x) * k, y + (ny - y) * k); ctx.lineTo(x + (nx - x) * k * .5, y + (ny - y) * k + 10); ctx.lineTo(x + (px - x) * k * .4, y + (py - y) * k + 6); ctx.lineTo(x + (px - x) * k, y + (py - y) * k); ctx.closePath(); ctx.fillStyle = '#f7fafc'; ctx.fill(); }
  ctx.beginPath(); ctx.moveTo(-900, 2000); for (let x = -900; x <= 1300; x += 50) ctx.lineTo(x, lerpBase(x) - 70 - Math.sin(x / 90) * 18); ctx.lineTo(1300, 2000); ctx.lineTo(-900, 2000); ctx.closePath(); ctx.fillStyle = '#a9c0ad'; ctx.fill();
}
function sfBackdrop() {
  ctx.beginPath(); ctx.moveTo(-900, 2000); for (let x = -900; x <= 1300; x += 40) ctx.lineTo(x, backY(Math.max(-640, Math.min(749, x))) - 50 - Math.sin(x / 160) * 40 - Math.sin(x / 57) * 8); ctx.lineTo(1300, 2000); ctx.lineTo(-900, 2000); ctx.closePath(); ctx.fillStyle = '#c3cdbf'; ctx.fill();
  // Sutro Tower and the Transamerica Pyramid, hazy in the distance
  const sx = -420, sy = backY(sx) - 92; ctx.strokeStyle = rgba('#c0362c', .55); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx - 18, sy); ctx.lineTo(sx, sy - 120); ctx.lineTo(sx + 18, sy); ctx.moveTo(sx, sy - 120); ctx.lineTo(sx, sy - 145); ctx.moveTo(sx - 16, sy - 98); ctx.lineTo(sx + 16, sy - 98); ctx.moveTo(sx - 10, sy - 60); ctx.lineTo(sx + 10, sy - 60); ctx.stroke();
  const tx = -170, ty = backY(tx) - 40; ctx.beginPath(); ctx.moveTo(tx - 22, ty); ctx.lineTo(tx, ty - 190); ctx.lineTo(tx + 22, ty); ctx.closePath(); ctx.fillStyle = 'rgba(214,220,224,.95)'; ctx.fill(); ctx.beginPath(); ctx.moveTo(tx - 22, ty); ctx.lineTo(tx, ty - 190); ctx.lineTo(tx - 6, ty); ctx.closePath(); ctx.fillStyle = 'rgba(190,199,205,.95)'; ctx.fill();
  for (const [x, h, w] of [[-260, 70, 30], [-110, 90, 26], [-60, 55, 34], [60, 80, 28]]) { const y = backY(x) - 20; ctx.fillStyle = 'rgba(205,213,218,.9)'; ctx.fillRect(x, y - h, w, h); }
}
function fog() {
  ctx.save(); ctx.filter = 'blur(26px)';
  for (let i = 0; i < 6; i++) {
    const x = ((i * 380 + time * 9) % 2200) - 1000, y = -120 + (i % 3) * 120 + Math.sin(time * .2 + i) * 14;
    ellipse(x, y, 260, 46, 'rgba(255,255,255,.55)');
  }
  for (let i = 0; i < 3; i++) { const v = ((i * 360 + time * 12) % (DEPTH + 300)) - 150, q = P(W + 220, v, 70); ellipse(q[0], q[1], 190, 36, 'rgba(255,255,255,.5)'); }
  ctx.restore();
}

function draw() {
  const cw = cv.clientWidth, ch = cv.clientHeight, dpr = Math.min(devicePixelRatio || 1, 2);
  if (cv.width !== Math.round(cw * dpr)) { cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr); }
  const minX = -680, maxX = 1010, minY = themeId === 'sf' ? -250 : -290, maxY = 720;
  const s = Math.min(cw / (maxX - minX), (ch - 40) / (maxY - minY)) * .97, ox = (cw - (maxX - minX) * s) / 2 - minX * s + 60, oy = 40 + (ch - 40 - (maxY - minY) * s) / 2 - minY * s;
  view = { s, ox, oy };
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, cw, ch);
  ctx.save(); ctx.translate(ox, oy); ctx.scale(s, s);
  if (themeId === 'zh') alps(); else sfBackdrop();
  water();
  ctx.save(); ctx.filter = 'blur(17px)'; plane(0, 8, W + 7, DEPTH + 2, -28, rgba(C('shadow'), .18)); ctx.restore();
  prism(0, 0, W, DEPTH, 15, -15, 'ground', 'groundfront', 'groundside');
  roads(); rails();
  for (const p of PROJECTS) { plane(p.u - 18, p.v - 18, 230, 214, 1, 'path'); plane(p.u - 13, p.v - 13, 220, 204, 2, p.lot % 2 ? 'lawn' : 'grass'); }
  const objects = [];
  // commons block (col 0, row 0)
  if (themeId === 'sf') objects.push({ depth: 70 + 74 + 200, fn: () => salesforcePark(70, 74) });
  else { lindenhof(70, 74); objects.push({ depth: 240 + 90 + 60, fn: () => grossmunster(220, 86) }); }
  const heights = {};
  for (const p of PROJECTS) objects.push({ depth: p.u + p.v + (p.w + p.d) * .5, fn: () => {
    const fn = themeId === 'sf' ? { tower: sfTower, office: somaLoft, house: victorian }[p.form] : { tower: primeTower, office: bankHouse, house: townhouse }[p.form];
    heights[p.id] = fn(p);
  } });
  objects.push({ depth: 82 + FRONT + 70 + 110, fn: () => themeId === 'sf' ? ferryBuilding(82, FRONT + 76) : stPeter(78, FRONT + 76) });
  objects.push({ depth: 380 + FRONT + 80 + 100, fn: () => themeId === 'sf' ? caltrainDepot(392, FRONT + 80) : hauptbahnhof(392, FRONT + 80) });
  // trees along lots
  const kind = themeId === 'sf' ? 'cypress' : 'round';
  for (const p of PROJECTS) {
    for (const [u, v] of [[p.u + 200, p.v + 30], [p.u + 200, p.v + 150]]) objects.push({ depth: u + v, fn: () => tree(u, v, .8, 0, p.form === 'house' && themeId === 'sf' && v > p.v + 100 ? 'palm' : kind) });
  }
  if (themeId === 'sf') for (const [u, v] of [[110, 100], [180, 130], [260, 110], [130, 220], [250, 240], [300, 180]]) objects.push({ depth: u + v + 1, fn: () => tree(u, v, .62, 36, 'round') });
  else for (const [u, v] of [[100, 100], [160, 110], [110, 200], [300, 120], [300, 230], [220, 260], [150, 270]]) objects.push({ depth: u + v, fn: () => tree(u, v, .78, 0, 'round') });
  // workers at their doors, idle agents in the commons
  let k = 0;
  for (const p of PROJECTS) for (let i = 0; i < p.live; i++, k++) {
    const idle = i >= p.working + p.needs, shirt = SHIRTS[k % 4];
    if (idle) { const u = 120 + (k % 5) * 30, v = 160 + (k % 3) * 22, z = themeId === 'sf' ? 36 : 3; objects.push({ depth: u + v + 2, fn: () => person(u + Math.sin(time * .5 + k) * 4, v, shirt, true, z, .9) }); }
    else { const u = p.u + 14 + (i % 5) * 24, v = p.v + p.d + 32 + Math.floor(i / 5) * 14; objects.push({ depth: u + v, fn: () => person(u + (motion ? Math.sin(time * .65 + i) * 8 : 0), v, shirt, true, 0, .9) }); }
  }
  // commuters along the sidewalks
  for (let i = 0; i < 46; i++) { const row = i % (ROWS + 1), dir = i % 2 ? 1 : -1, u = ((i * 131 + dir * time * 14) % (W - 40) + (W - 40)) % (W - 40) + 20, v = row * BLOCK + (dir > 0 ? 47 : 8); objects.push({ depth: u + v, fn: () => person(u, v, SHIRTS[i % 4], true, 3, .62) }); }
  // traffic: cable cars / trams on every avenue, buses alternating
  for (let row = 0; row <= ROWS; row++) {
    const span = W - 120, u = 10 + (time * 22 + row * 290) % span, v = row * BLOCK + (themeId === 'sf' ? 18 : 16);
    objects.push({ depth: u + v + 30, fn: () => themeId === 'sf' ? cableCar(u, v) : tram(u, v) });
    const u2 = W - 90 - (time * 30 + row * 170) % span;
    if (themeId === 'sf' && row !== 1) objects.push({ depth: u2 + v + 20, fn: () => muni(u2, v - 2) });
  }
  tramWires(objects);
  if (themeId === 'sf') goldenGate(objects); else lake(objects);
  objects.sort((a, b) => a.depth - b.depth);
  for (const o of objects) o.fn();
  const tr = 230 + (time * 40) % Math.max(500, W);

  if (themeId === 'sf') fog();
  ctx.restore();
  placeLabels(heights);
}

// ---------------------------------------------------------------- DOM labels
let view = { s:1, ox:0, oy:0 };
const labelsEl = document.getElementById('labels');
function placeLabels(heights) {
  const toScreen = (u, v, z) => { const [x, y] = P(u, v, z); return [x * view.s + view.ox, y * view.s + view.oy]; };
  let html = '';
  for (const p of PROJECTS) {
    const [x, y] = toScreen(p.u + p.w / 2, p.v + p.d / 2, (heights[p.id] || 120) + 30);
    html += `<div class="label" style="left:${x}px;top:${y}px"><b>${p.name}</b><span class="live">${p.live} live</span>${p.needs ? ` · <span class="needs">${p.needs} needs you</span>` : ''}</div>`;
  }
  const civic = [[themeId === 'sf' ? 'SALESFORCE PARK' : 'THE COMMONS · LINDENHOF', 70, 300, themeId === 'sf' ? 40 : 4], ['SCHEDULER', 165, FRONT + 175, 0], ['DONE', 445, FRONT + 175, 0]];
  for (const [t, u, v, z] of civic) { const [x, y] = toScreen(u, v, z); html += `<div class="civic" style="left:${x}px;top:${y}px">${t}</div>`; }
  if (labelsEl.innerHTML !== html) labelsEl.innerHTML = html;
}

// ---------------------------------------------------------------- theme switch + loop
function setTheme(id) {
  themeId = id; T = THEMES[id];
  document.body.className = id;
  document.body.style.setProperty('--bg', T.bg); document.body.style.setProperty('--accent', T.accent);
  document.body.style.setProperty('--title', T.titleInk); document.body.style.setProperty('--civic', T.civic);
  document.getElementById('title').textContent = T.title;
  document.getElementById('legendTitle').textContent = T.label;
  document.getElementById('legend').innerHTML = T.legend.map(([a, b]) => `<tr><td>${a}</td><td>${b}</td></tr>`).join('');
  document.querySelectorAll('.switch button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.theme === id)));
  location.hash = id;
}
document.querySelectorAll('.switch button').forEach(b => b.addEventListener('click', () => setTheme(b.dataset.theme)));
document.getElementById('legendBtn').addEventListener('click', e => { const a = document.querySelector('aside'); a.hidden = !a.hidden; e.target.textContent = a.hidden ? 'Show legend' : 'Hide legend'; });
document.getElementById('pause').addEventListener('click', e => { motion = !motion; e.target.textContent = motion ? 'Pause motion' : 'Resume motion'; });
if (matchMedia('(prefers-reduced-motion: reduce)').matches) { motion = false; document.getElementById('pause').textContent = 'Resume motion'; }
setTheme(location.hash === '#zh' ? 'zh' : 'sf');
let last = performance.now();
function frame(now) { if (motion) time += (now - last) / 1000; last = now; draw(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
</script>
